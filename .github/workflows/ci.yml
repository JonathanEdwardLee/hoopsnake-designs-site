name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: php-actions/composer@v6
        with:
          php_version: '8.3'
          command: install
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run verify:release
      - run: npm run verify:no-external-verification
      - run: npm run test:php
      - run: bash scripts/verify-release-autoload.sh
      - run: npm run report:release
      - run: npm run test:apache
      - run: npm run test:publish
      - run: npm audit --audit-level=high
      - name: Verify no secret values in tracked files
        run: bash scripts/check-no-secrets.sh
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hsd-release-${{ github.sha }}
          path: release/
          if-no-files-found: error

  publish-hostinger-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: php-actions/composer@v6
        with:
          php_version: '8.3'
          command: install
      - run: npm ci
      - run: npm run build
      - run: npm run verify:release
      - run: npm run verify:no-external-verification
      - run: npm run test:php
      - run: bash scripts/verify-release-autoload.sh
      - run: npm run test:apache
      - name: Publish hostinger-deploy artifact branch
        run: bash scripts/publish-hostinger-deploy.sh
